services:
  app:
    build: .
    container_name: expertboard-app
    env_file:
      - .env
    environment:
      GA4GH_VRS_DATAPROXY_URI: ${GA4GH_VRS_DATAPROXY_URI:-seqrepo+https://services.genomicmedlab.org/seqrepo}

    ports:
      - "${EXPERTBOARD_APP_PORT:-8010}:8010"
    volumes:
      - ./app:/app/app
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  mysql:
    image: mysql:8.4
    container_name: expertboard-mysql
    command: ["mysqld", "--lower_case_table_names=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${EXPERTBOARD_MYSQL_ROOT_PASSWORD:-expertboard_root_dev}
      MYSQL_DATABASE: ${EXPERTBOARD_MYSQL_DATABASE:-expertboard}
      MYSQL_USER: ${EXPERTBOARD_MYSQL_USER:-expertboard}
      MYSQL_PASSWORD: ${EXPERTBOARD_MYSQL_PASSWORD:-expertboard_dev}
    ports:
      - "${EXPERTBOARD_MYSQL_PORT:-13307}:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  seqrepo:
    image: biocommons/seqrepo-rest-service:0.2.2
    container_name: expertboard-seqrepo
    profiles: ["vrs"]
    command: ["seqrepo-rest-service", "/mnt/seqrepo/${SEQREPO_VERSION:-2024-12-20}"]
    ports:
      - "${EXPERTBOARD_SEQREPO_PORT:-5000}:5000"
    volumes:
      - ${SEQREPO_DATA_DIR:-./seqrepo-data}:/mnt/seqrepo:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/seqrepo/1/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

