services:
  app:
    build: .
    container_name: expertboard-app
    env_file:
      - .env
    environment:
      EXPERTBOARD_OIDC_ISSUER_INTERNAL: http://keycloak:8080/realms/expertboard
      EXPERTBOARD_OIDC_ISSUER_PUBLIC: http://localhost:${KEYCLOAK_PORT:-8081}/realms/expertboard
      EXPERTBOARD_OIDC_CLIENT_ID: ${EXPERTBOARD_OIDC_CLIENT_ID:-expertboard-app}
      EXPERTBOARD_OIDC_CLIENT_SECRET: ${EXPERTBOARD_OIDC_CLIENT_SECRET:-changeme-in-dev}
      EXPERTBOARD_OIDC_REDIRECT_URI: http://localhost:${EXPERTBOARD_APP_PORT:-8010}/auth/callback
    ports:
      - "${EXPERTBOARD_APP_PORT:-8010}:8010"
    volumes:
      - ./app:/app/app
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: expertboard-mysql
    command: ["mysqld", "--lower_case_table_names=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${EXPERTBOARD_MYSQL_ROOT_PASSWORD:-expertboard_root_dev}
      MYSQL_DATABASE: ${EXPERTBOARD_MYSQL_DATABASE:-expertboard}
      MYSQL_USER: ${EXPERTBOARD_MYSQL_USER:-expertboard}
      MYSQL_PASSWORD: ${EXPERTBOARD_MYSQL_PASSWORD:-expertboard_dev}
    ports:
      - "${EXPERTBOARD_MYSQL_PORT:-13307}:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: expertboard-keycloak
    # start-dev + an embedded dev DB is fine for local/demo use; it is not a
    # production configuration (no persistent external DB, no hardened TLS).
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    healthcheck:
      # curl/wget aren't in this base image, so this just confirms the HTTP
      # port is accepting connections (good enough to gate the app container).
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

